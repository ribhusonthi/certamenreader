<!doctype html>
<html lang="en">

<head>
    <title>Certamen Reader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="/apple-touch-icon-precomposed.png" rel="apple-touch-icon-precomposed">
    <link type="image/x-icon" href="/favicon.ico" rel="icon">

    <link href="/bootstrap/light.css" rel="stylesheet">
    <link href="/bootstrap/dark.css" rel="stylesheet" id="custom-css">
    <script type="module" src="/apply-theme.js"></script>
</head>

<body>
    <nav class="navbar navbar-dark navbar-expand-lg bg-custom" id="navbar" style="z-index: 10">
        <div class="container-fluid">
            <a class="navbar-brand brand-editorial ms-1 py-0" id="logo" href="/">
                <span class="brand-mark"><img src="/buzzer-icon.png" alt=""></span><span class="brand-word">Certamen<b>Reader</b></span>
            </a>
            <button class="navbar-toggler" data-bs-target="#navbarSupportedContent" data-bs-toggle="collapse" type="button"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/singleplayer">Singleplayer</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/multiplayer">Multiplayer</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/db">Database</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/leaderboards">Leaderboards</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                    <!-- <li class="nav-item">
                        <a class="nav-link" href="/frequency-list">Frequency List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/geoword">Geoword</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/api-docs">API</a>
                    </li> -->
                </ul>
                <div class="d-flex">
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/user/login" id="login-link">Log in</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="mp">
        <div class="mp-hdr">
            <div>
                <h1>Rooms</h1>
                <p>Play Certamen real-time against other players. Join a public room or create your own — share the URL to invite friends.</p>
            </div>
            <form id="form" class="d-flex gap-2 align-items-center flex-wrap">
                <input class="form-control" id="new-room-name" type="text" style="min-width: 200px;">
                <div class="form-check form-switch m-0">
                    <input class="form-check-input" id="private-room-checkbox" type="checkbox" role="switch">
                    <label class="form-check-label" for="private-room-checkbox">Private</label>
                </div>
                <button class="btn btn-primary" type="submit">Create / Join</button>
            </form>
        </div>

        <div class="mp-rooms" id="room-list"></div>
    </div>

    <script type="module" src="/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="/script.js"></script>

    <script type="module" src="/multiplayer/index.js"></script>
</body>

</html>
