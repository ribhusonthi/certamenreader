<!doctype html>
<html lang="en">

<head>
    <title>Certamen Reader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">

    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="/apple-touch-icon-precomposed.png" rel="apple-touch-icon-precomposed">
    <link type="image/x-icon" href="/favicon.ico" rel="icon">

    <!-- Load only the active theme's stylesheet. light.css and dark.css are
         ~348 KB each and near-identical, so linking both doubled the CSS
         payload to render one of them. Injected synchronously here so it
         still blocks paint — no flash of unstyled content. -->
    <script>(function(){var t=localStorage.getItem('color-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.colorTheme=t;var l=document.createElement('link');l.id='custom-css';l.rel='stylesheet';l.href='/bootstrap/'+t+'.css';document.head.appendChild(l)})()</script>
    <noscript><link id="custom-css" rel="stylesheet" href="/bootstrap/light.css"></noscript>
    <script type="module" src="/apply-theme.js"></script>
</head>

<body>
    <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="text-center px-4" style="max-width: 400px;">
            <h1 class="display-5 fw-bold mb-4">Certamen Reader</h1>
            <p class="text-muted mb-4">Sign in with your Google account to continue.</p>
            <div id="error-msg" class="alert alert-danger d-none" role="alert">
                Your account is not authorized to access Certamen Reader.
            </div>
            <a href="/auth/google" class="btn btn-lg btn-outline-primary d-flex align-items-center justify-content-center gap-2 mx-auto" id="google-login-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Sign in with Google
            </a>
        </div>
    </div>

    <script type="module" src="/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'unauthorized') {
            document.getElementById('error-msg').classList.remove('d-none');
        }
    </script>
</body>

</html>
