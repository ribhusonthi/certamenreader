<!doctype html>
<html lang="en">

<head>
    <title>Certamen Reader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="View personalized stats in a graphical format.">

    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="/apple-touch-icon-precomposed.png" rel="apple-touch-icon-precomposed">
    <link type="image/x-icon" href="/favicon.ico" rel="icon">

    <!-- Load only the active theme's stylesheet. light.css and dark.css are
         ~348 KB each and near-identical, so linking both doubled the CSS
         payload to render one of them. Injected synchronously here so it
         still blocks paint — no flash of unstyled content. -->
    <script>(function(){var t=localStorage.getItem('color-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.colorTheme=t;var l=document.createElement('link');l.id='custom-css';l.rel='stylesheet';l.href='/bootstrap/'+t+'.css';document.head.appendChild(l)})()</script>
    <noscript><link id="custom-css" rel="stylesheet" href="/bootstrap/light.css"></noscript>
    <script type="module" src="/apply-theme.js"></script>

    <script type="module" src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>

<body>
    <nav class="navbar navbar-dark navbar-expand-lg bg-custom" id="navbar" style="z-index: 10">
        <div class="container-fluid">
            <a class="navbar-brand brand-editorial ms-1 py-0" id="logo" href="/">
                <span class="brand-mark"><img src="/buzzer-icon.png" alt="" width="373" height="669" decoding="async"></span><span class="brand-word">Certamen<b>Reader</b></span>
            </a>
            <button class="navbar-toggler" data-bs-target="#navbarSupportedContent" data-bs-toggle="collapse" type="button"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/singleplayer">Singleplayer</a>
                    </li>
                    <li class="nav-item dropdown nav-multiplayer">
                        <a class="nav-link" href="/multiplayer">Multiplayer</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/multiplayer">Solo</a></li>
                            <li><a class="dropdown-item" href="/multiplayer/team">Team Mode</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ranked">Ranked</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/db">Database</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/leaderboards">Leaderboards</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/user/login" id="login-link">Log in</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-xl mt-3 mb-5 pb-5">
        <form class="mb-3 mb-md-0" id="form">
            <div class="row">
                <div class="col-12 col-md-6 mb-2">
                    <div class="dropdown-checklist btn-group w-100">
                        <button class="btn btn-default text-start w-100" id="dropdownMenu1" data-bs-toggle="dropdown" type="button"
                            aria-expanded="true" aria-haspopup="true">
                            Difficulties
                        </button>
                        <button class="btn btn-default dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown"
                            type="button"></button>
                        <ul class="dropdown-menu checkbox-menu allow-focus" id="difficulties" aria-labelledby="dropdownMenu1">
                            <li><label><input type="checkbox" value="1" /> 1: Novice</label></li>
                            <li><label><input type="checkbox" value="5" /> 5: Intermediate</label></li>
                            <li><label><input type="checkbox" value="10" /> 10: Advanced</label></li>
                        </ul>
                    </div>
                </div>
                <div class="input-group col-12 col-md-6 mb-2">
                    <input type="text" class="form-control" id="set-name" placeholder="Set Name" list="set-list" />
                    <datalist id="set-list"></datalist>
                    <button type="submit" class="btn btn-info">Submit</button>
                </div>
            </div>
            <div class="row">
                <div class="col-12 col-md-6">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="include-multiplayer" checked />
                        <label class="form-check-label" for="include-multiplayer">Include multiplayer stats</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="include-singleplayer" checked />
                        <label class="form-check-label" for="include-singleplayer">Include singleplayer stats</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="cumulative" />
                        <label class="form-check-label" for="cumulative">Show cumulative view</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="filter" checked />
                        <label class="form-check-label" for="filter">Exclude days with fewer than 5 data points</label>
                    </div>
                </div>
                <div class="col-12 col-md-6 text-md-end">
                    <div>
                        <label for="start-date">Start Date (optional):</label>
                        <input type="date" id="start-date" name="start-date">
                    </div>
                    <div>
                        <label for="end-date">End Date (optional):</label>
                        <input type="date" id="end-date" name="end-date">
                    </div>
                </div>
            </div>
        </form>
        <div class="row mb-5">
            <div class="col-12">
                <canvas id="question-count"></canvas>
            </div>
        </div>
        <div class="row mb-5">
            <div class="col-12">
                <canvas id="ppb"></canvas>
            </div>
        </div>
        <div class="row mb-5">
            <div class="col-12">
                <canvas id="result-per-bonus"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="/script.js"></script>

    <script type="module" src="/user/stats/script.js"></script>
    <script type="module" src="/user/stats/bonus-graph.js"></script>
</body>

</html>
