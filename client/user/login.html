<!doctype html>
<html lang="en">

<head>
    <title>Log in · Certamen Reader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Log in or create a Certamen Reader account.">

    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="/apple-touch-icon-precomposed.png" rel="apple-touch-icon-precomposed">
    <link type="image/x-icon" href="/favicon.ico" rel="icon">

    <script>(function(){var t=localStorage.getItem('color-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.colorTheme=t;var l=document.createElement('link');l.id='custom-css';l.rel='stylesheet';l.href='/bootstrap/'+t+'.css';document.head.appendChild(l)})()</script>
    <noscript><link id="custom-css" rel="stylesheet" href="/bootstrap/light.css"></noscript>
    <script type="module" src="/apply-theme.js"></script>
</head>

<body class="auth-page">
    <main class="auth-shell" id="main-content">
        <a class="auth-brand brand-editorial" href="/">
            <span class="brand-mark"><img src="/buzzer-icon.png" alt="" width="373" height="669" decoding="async"></span><span class="brand-word">Certamen<b>Reader</b></span>
        </a>

        <section class="auth-card c-card" aria-live="polite">
            <!-- Log in / Create account -->
            <div id="auth-main">
                <div class="auth-tabs" role="tablist">
                    <button class="auth-tab" id="tab-login" type="button" role="tab" data-mode="login">Log in</button>
                    <button class="auth-tab" id="tab-signup" type="button" role="tab" data-mode="signup">Create account</button>
                </div>

                <a class="auth-google" id="google-btn" href="/auth/google">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Continue with Google
                </a>

                <div class="auth-divider"><span>or</span></div>

                <div class="auth-alert" id="auth-alert" hidden></div>

                <form class="auth-form" id="login-form" novalidate>
                    <label class="auth-field">
                        <span>Email or username</span>
                        <input class="form-control" name="identifier" type="text" autocomplete="username" required>
                    </label>
                    <label class="auth-field">
                        <span class="auth-field-row">Password <button class="auth-link" id="forgot-link" type="button">Forgot password?</button></span>
                        <input class="form-control" name="password" type="password" autocomplete="current-password" required>
                    </label>
                    <button class="btn btn-primary auth-submit" type="submit">Log in</button>
                </form>

                <form class="auth-form" id="signup-form" novalidate hidden>
                    <label class="auth-field">
                        <span>Username</span>
                        <input class="form-control" name="username" type="text" autocomplete="username" minlength="3" maxlength="24" required>
                        <small>3–24 characters. Shown on leaderboards.</small>
                    </label>
                    <label class="auth-field">
                        <span>Email</span>
                        <input class="form-control" name="email" type="email" autocomplete="email" required>
                        <small>We'll send a link to verify it. One account per email.</small>
                    </label>
                    <label class="auth-field">
                        <span>Password</span>
                        <input class="form-control" name="password" type="password" autocomplete="new-password" minlength="8" required>
                        <small>At least 8 characters.</small>
                    </label>
                    <!-- Honeypot: hidden from people, so only bots fill it in. -->
                    <label class="auth-hp" aria-hidden="true">Website <input name="website" type="text" tabindex="-1" autocomplete="off"></label>
                    <button class="btn btn-primary auth-submit" type="submit">Create account</button>
                </form>
            </div>

            <!-- Forgot password -->
            <form class="auth-form" id="forgot-form" novalidate hidden>
                <h1 class="auth-title">Reset your password</h1>
                <p class="auth-sub">Enter your account's email and we'll send you a link to set a new password. This also works for Google accounts that want a password.</p>
                <div class="auth-alert" id="forgot-alert" hidden></div>
                <label class="auth-field">
                    <span>Email</span>
                    <input class="form-control" name="email" type="email" autocomplete="email" required>
                </label>
                <button class="btn btn-primary auth-submit" type="submit">Send reset link</button>
                <button class="auth-link auth-back" type="button" data-back>← Back to log in</button>
            </form>

            <!-- Confirmation after sign-up / reset request -->
            <div id="auth-sent" hidden>
                <h1 class="auth-title">Check your inbox</h1>
                <p class="auth-sub" id="auth-sent-text"></p>
                <p class="auth-sub">Nothing there? Check spam, or <button class="auth-link" id="resend-btn" type="button">send it again</button>.</p>
                <button class="auth-link auth-back" type="button" data-back>← Back to log in</button>
            </div>
        </section>

        <a class="auth-home" href="/">← Back to home</a>
    </main>

    <script type="module" src="/user/login.js"></script>
</body>

</html>
