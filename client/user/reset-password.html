<!doctype html>
<html lang="en">

<head>
    <title>Set a new password · Certamen Reader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <link type="image/x-icon" href="/favicon.ico" rel="icon">

    <script>(function(){var t=localStorage.getItem('color-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.colorTheme=t;var l=document.createElement('link');l.id='custom-css';l.rel='stylesheet';l.href='/bootstrap/'+t+'.css';document.head.appendChild(l)})()</script>
    <noscript><link id="custom-css" rel="stylesheet" href="/bootstrap/light.css"></noscript>
    <script type="module" src="/apply-theme.js"></script>
</head>

<body class="auth-page">
    <main class="auth-shell" id="main-content">
        <a class="auth-brand brand-editorial" href="/">
            <span class="brand-mark"><img src="/buzzer-icon.png" alt="" width="373" height="669" decoding="async"></span><span class="brand-word">Certamen<b>Reader</b></span>
        </a>

        <section class="auth-card c-card" aria-live="polite">
            <form class="auth-form" id="reset-form" novalidate>
                <h1 class="auth-title">Set a new password</h1>
                <div class="auth-alert" id="reset-alert" hidden></div>
                <label class="auth-field">
                    <span>New password</span>
                    <input class="form-control" name="password" type="password" autocomplete="new-password" minlength="8" required>
                    <small>At least 8 characters.</small>
                </label>
                <label class="auth-field">
                    <span>Confirm password</span>
                    <input class="form-control" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
                </label>
                <button class="btn btn-primary auth-submit" type="submit">Save and log in</button>
            </form>
        </section>

        <a class="auth-home" href="/user/login">← Back to log in</a>
    </main>

    <script type="module">
        const form = document.getElementById('reset-form');
        const alertEl = document.getElementById('reset-alert');
        const token = new URLSearchParams(window.location.search).get('token');
        const fail = message => { alertEl.textContent = message; alertEl.hidden = false; };
        if (!token) fail('This page needs the link from your reset email.');

        form.addEventListener('submit', async ev => {
            ev.preventDefault();
            const { password, confirm } = Object.fromEntries(new FormData(form));
            if (password !== confirm) return fail('The passwords don\'t match.');
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                const res = await fetch('/auth/email/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || 'Something went wrong. Try again in a moment.');
                window.location.href = '/?_loggedIn=1';
            } catch (err) {
                fail(err.message);
                button.disabled = false;
            }
        });
    </script>
</body>

</html>
