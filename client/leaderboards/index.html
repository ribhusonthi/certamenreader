<!doctype html>
<html lang="en">

<head>
    <title>Leaderboards — Certamen Reader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Top players ranked by performance points.">

    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="/apple-touch-icon-precomposed.png" rel="apple-touch-icon-precomposed">
    <link type="image/x-icon" href="/favicon.ico" rel="icon">

    <!-- Load only the active theme's stylesheet. light.css and dark.css are
         ~348 KB each and near-identical, so linking both doubled the CSS
         payload to render one of them. Injected synchronously here so it
         still blocks paint — no flash of unstyled content. -->
    <script>(function(){var t=localStorage.getItem('color-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.colorTheme=t;var l=document.createElement('link');l.id='custom-css';l.rel='stylesheet';l.href='/bootstrap/'+t+'.css';document.head.appendChild(l)})()</script>
    <noscript><link id="custom-css" rel="stylesheet" href="/bootstrap/light.css"></noscript>
    <script type="module" src="/apply-theme.js"></script>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav class="navbar navbar-dark navbar-expand-lg bg-custom" id="navbar" style="z-index: 10">
        <div class="container-fluid">
            <a class="navbar-brand brand-editorial ms-1 py-0" id="logo" href="/">
                <span class="brand-mark"><img src="/buzzer-icon.png" alt="" width="373" height="669" decoding="async"></span>
                <span class="brand-word">Certamen<b>Reader</b></span>
            </a>
            <button class="navbar-toggler" data-bs-target="#navbarSupportedContent" data-bs-toggle="collapse" type="button"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/singleplayer">Singleplayer</a></li>
                    <li class="nav-item dropdown nav-multiplayer">
                        <a class="nav-link" href="/multiplayer">Multiplayer</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/multiplayer">Solo</a></li>
                            <li><a class="dropdown-item" href="/multiplayer/team">Team Mode</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/ranked">Ranked</a></li>
                    <li class="nav-item"><a class="nav-link" href="/db">Database</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/leaderboards" aria-current="page">Leaderboards</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                </ul>
                <div class="d-flex">
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/user/login" id="login-link">Log in</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <main id="main-content" class="lb-page">
        <header class="lb-hdr">
            <span class="ed-eyebrow">Leaderboards</span>
            <h1>Top <em>players</em></h1>
            <p>Ranked by total <b>performance points</b> earned in each category.</p>
        </header>

        <div class="lb-tabs" id="lb-tabs" role="tablist" aria-label="Leaderboard category">
            <button type="button" role="tab" class="lb-tab" data-cat="Mythology" data-active="true" aria-selected="true">Mythology</button>
            <button type="button" role="tab" class="lb-tab" data-cat="Roman History" aria-selected="false">History</button>
            <button type="button" role="tab" class="lb-tab" data-cat="Latin Literature" aria-selected="false">Literature</button>
            <button type="button" role="tab" class="lb-tab" data-cat="Language" aria-selected="false">Language</button>
            <button type="button" role="tab" class="lb-tab" data-cat="Culture" aria-selected="false">Culture</button>
        </div>

        <div class="lb-list-hdr">
            <div>#</div>
            <div>player</div>
            <div class="num">buzzes</div>
            <div class="num">best buzz</div>
            <div class="num">total PP</div>
        </div>
        <div id="lb-list">
            <div class="lb-empty">Loading…</div>
        </div>
    </main>

    <script type="module" src="/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="/script.js"></script>
    <script type="module" src="/leaderboards/index.js"></script>
</body>

</html>
