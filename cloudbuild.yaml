steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/certamenreader/certamenreader:$COMMIT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/certamenreader/certamenreader:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - certamenreader
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/certamenreader/certamenreader:$COMMIT_SHA
      - --region=us-central1

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/certamenreader/certamenreader:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
